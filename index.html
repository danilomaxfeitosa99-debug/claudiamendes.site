:root{--verde:#86cf75;--verde-esc:#0f2a0c;--bg:#0c0c0c}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#1c1c1c}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
.tela{position:relative;width:100%;max-width:480px;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.foto{position:absolute;top:0;left:-14%;width:128%;aspect-ratio:637/632;background:url("foto.jpg") center/100% 100% no-repeat;-webkit-mask-image:linear-gradient(#000 58%,transparent 100%);mask-image:linear-gradient(#000 58%,transparent 100%);z-index:0}
.tela.sem-foto .foto{display:none}
.tela::before{z-index:1;content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.12) 35%,rgba(0,0,0,.78) 68%,#000 100%)}
.tela.sem-foto{background:radial-gradient(120% 70% at 50% 0%,#2a3a27 0%,#0c0c0c 70%)}
.conteudo{position:relative;z-index:2;padding:0 24px calc(26px + env(safe-area-inset-bottom))}
.autor{display:flex;align-items:center;gap:14px;font-size:15px;font-weight:700;letter-spacing:.2px;margin-bottom:12px}
.autor::after{content:"";height:1px;width:56px;background:rgba(255,255,255,.7)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(40px,12.5vw,58px);line-height:1;letter-spacing:-1.5px;margin-bottom:26px}
h1 em{display:block;font-weight:400;font-style:italic;color:#c3e8b8}
.botao{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:64px;background:var(--verde);color:var(--verde-esc);font-weight:800;font-size:17px;letter-spacing:.2px;text-decoration:none;border-radius:14px;box-shadow:0 10px 30px rgba(134,207,117,.35);animation:pulso 2.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.botao:active{transform:scale(.98)}
.botao svg{width:26px;height:26px;flex:none}
@keyframes pulso{0%,100%{box-shadow:0 10px 30px rgba(134,207,117,.30)}50%{box-shadow:0 10px 38px rgba(134,207,117,.6)}}
.micro{text-align:center;font-size:13px;color:rgba(255,255,255,.78);margin-top:12px}
.rodape{text-align:center;font-size:12px;color:rgba(255,255,255,.6);margin-top:20px}
.rodape a{color:inherit;text-decoration:none;padding:6px 4px}
@media (prefers-reduced-motion:reduce){.botao{animation:none}}
@media (min-width:600px){body{align-items:center;padding:24px 0}.tela{min-height:860px;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.6)}}
/* Desktop: foto à esquerda, texto e botão à direita (no mesmo link) */
@media (min-width:900px){
 html,body{background:radial-gradient(90% 80% at 50% 0%,#26331f 0%,#141414 70%)}
 body{padding:40px 32px}
 .tela{max-width:1120px;min-height:max(620px,calc(100vh - 80px));justify-content:center;align-items:flex-end;border-radius:32px}
 .foto{top:0;bottom:0;left:0;width:58%;height:100%;aspect-ratio:auto;background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,#000 62%,transparent 100%);mask-image:linear-gradient(90deg,#000 62%,transparent 100%)}
 .tela::before{background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.1) 40%,rgba(0,0,0,.85) 62%,#000 78%)}
 .tela.sem-foto{background:radial-gradient(90% 90% at 20% 30%,#2a3a27 0%,#0c0c0c 70%)}
 .conteudo{width:46%;padding:48px 56px 48px 0}
 .autor{font-size:16px;margin-bottom:16px}
 h1{font-size:clamp(56px,5.6vw,76px);margin-bottom:34px;letter-spacing:-2px}
 .botao{min-height:68px;font-size:18px;max-width:440px;transition:transform .15s}
 .botao:hover{transform:translateY(-2px)}
 .micro,.rodape{text-align:left;max-width:440px;text-align:center}
}
</style>
